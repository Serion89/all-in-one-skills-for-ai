<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="border-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-ring {
      0% { r: 3.5px; opacity: 0.9; stroke-width: 1px; }
      50% { r: 8px; opacity: 0.25; stroke-width: 1.5px; }
      100% { r: 12px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes beam-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .pulsing-ring {
      animation: pulse-ring 2.8s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      transform-origin: 40px 36px;
    }
    .beam-animation {
      animation: beam-slide 6s ease-in-out infinite alternate;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
      fill: #f0f6fc;
    }
    .text-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #3fb950;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: 0.1px;
      fill: #8b949e;
    }
    .metric-value {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #e6edf3;
    }
    .metric-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #6e7681;
    }
  </style>

  <!-- Container Box -->
  <rect width="880" height="230" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.2" />

  <!-- Background Grid -->
  <rect width="880" height="230" rx="10" fill="url(#grid)" />

  <!-- Top Border Accent -->
  <g clip-path="url(#top-clip)">
    <clipPath id="top-clip">
      <rect width="880" height="3" rx="2" />
    </clipPath>
    <rect x="-440" y="0" width="880" height="2" fill="url(#border-beam)" class="beam-animation" />
  </g>

  <!-- Status Beacon & System Tag -->
  <g transform="translate(0, 0)">
    <circle cx="40" cy="36" r="3.5" fill="#3fb950" />
    <circle cx="40" cy="36" r="3.5" fill="none" stroke="#3fb950" class="pulsing-ring" />
    <text x="56" y="40" class="text-tag">ALL-IN-ONE AGENT SKILLS // OPEN SPECIFICATION COMPLIANT</text>
  </g>

  <!-- Main Repository Title -->
  <text x="40" y="86" class="text-title">ALL-IN-ONE SKILLS FOR AI</text>

  <!-- Subtitle Line -->
  <text x="40" y="114" class="text-sub">115 production-audited agent skills across 12 engineering disciplines &#8226; Claude Code, Cursor, Windsurf, Antigravity</text>

  <!-- Lower Telemetry Matrix / HUD -->
  <g transform="translate(40, 146)">
    <!-- Metric Box 1 -->
    <rect x="0" y="0" width="190" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" class="metric-label">VERIFIED MODULES</text>
    <text x="14" y="41" class="metric-value">115 SKILL.MD</text>

    <!-- Metric Box 2 -->
    <rect x="202" y="0" width="190" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" transform="translate(202, 0)" class="metric-label">DOMAIN GUILDS</text>
    <text x="14" y="41" transform="translate(202, 0)" class="metric-value">12 DISCIPLINES</text>

    <!-- Metric Box 3 -->
    <rect x="404" y="0" width="190" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" transform="translate(404, 0)" class="metric-label">TOKEN EFFICIENCY</text>
    <text x="14" y="41" transform="translate(404, 0)" class="metric-value">65% TO 75% SAVED</text>

    <!-- Metric Box 4 -->
    <rect x="606" y="0" width="190" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" transform="translate(606, 0)" class="metric-label">AUDIT GUARANTEE</text>
    <text x="14" y="41" transform="translate(606, 0)" class="metric-value">0 EXECUTABLES // SPEC</text>
  </g>
</svg>
