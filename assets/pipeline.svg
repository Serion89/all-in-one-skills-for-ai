<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="150" fill="none">
  <defs>
    <linearGradient id="pipeline-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="bus-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    @keyframes data-flow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes node-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .flow-line {
      stroke: url(#bus-glow);
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: data-flow 1.2s linear infinite;
    }
    .stage-card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
      transition: all 0.2s ease;
    }
    .stage-idx {
      font-family: ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      fill: #58a6ff;
      letter-spacing: 0.5px;
    }
    .stage-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #f0f6fc;
      letter-spacing: -0.2px;
    }
    .stage-sub {
      font-family: ui-monospace, monospace;
      font-size: 9px;
      font-weight: 400;
      fill: #8b949e;
    }
    .header-tag {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #8b949e;
    }
  </style>

  <!-- Container -->
  <rect width="880" height="150" rx="10" fill="url(#pipeline-bg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Pipeline Header -->
  <g transform="translate(24, 24)">
    <text x="0" y="0" class="header-tag">AGENT EXECUTION BUS // END-TO-END PIPELINE LIFECYCLE</text>
  </g>

  <!-- Connecting Data Bus with Animated Pulses -->
  <line x1="90" y1="84" x2="790" y2="84" class="flow-line" />

  <!-- Stage 1: Token Economy -->
  <g transform="translate(24, 48)">
    <rect width="128" height="72" rx="6" class="stage-card" />
    <text x="12" y="20" class="stage-idx">01 // TOKEN</text>
    <text x="12" y="38" class="stage-title">Economy</text>
    <text x="12" y="54" class="stage-sub">caveman &#8226; ponytail</text>
  </g>

  <!-- Stage 2: Alignment -->
  <g transform="translate(164, 48)">
    <rect width="128" height="72" rx="6" class="stage-card" />
    <text x="12" y="20" class="stage-idx">02 // ALIGN</text>
    <text x="12" y="38" class="stage-title">Discovery</text>
    <text x="12" y="54" class="stage-sub">to-spec &#8226; grill-me</text>
  </g>

  <!-- Stage 3: Architecture -->
  <g transform="translate(304, 48)">
    <rect width="128" height="72" rx="6" class="stage-card" />
    <text x="12" y="20" class="stage-idx">03 // ARCH</text>
    <text x="12" y="38" class="stage-title">System Design</text>
    <text x="12" y="54" class="stage-sub">hexagonal &#8226; ddia</text>
  </g>

  <!-- Stage 4: Craft -->
  <g transform="translate(444, 48)">
    <rect width="128" height="72" rx="6" class="stage-card" />
    <text x="12" y="20" class="stage-idx">04 // CRAFT</text>
    <text x="12" y="38" class="stage-title">Interface UI</text>
    <text x="12" y="54" class="stage-sub">impeccable &#8226; tokens</text>
  </g>

  <!-- Stage 5: Verification -->
  <g transform="translate(584, 48)">
    <rect width="128" height="72" rx="6" class="stage-card" />
    <text x="12" y="20" class="stage-idx">05 // VERIFY</text>
    <text x="12" y="38" class="stage-title">Test &amp; Security</text>
    <text x="12" y="54" class="stage-sub">pact &#8226; stride &#8226; tdd</text>
  </g>

  <!-- Stage 6: SRE -->
  <g transform="translate(724, 48)">
    <rect width="128" height="72" rx="6" class="stage-card" />
    <text x="12" y="20" class="stage-idx">06 // SRE</text>
    <text x="12" y="38" class="stage-title">Production</text>
    <text x="12" y="54" class="stage-sub">k8s &#8226; release-it</text>
  </g>
</svg>
